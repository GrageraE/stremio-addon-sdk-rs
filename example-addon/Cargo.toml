[package]
name = "example-addon"
version = "0.1.0"
authors = ["Sleeyax <yourd3veloper@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
shuttle = ["dep:shuttle-runtime"]

[dependencies]
# Stremio-core is reexported from the SDK
# stremio-core = { git = "https://github.com/stremio/stremio-core", rev = "3d3e1008cd73d028decaf3f7ae572edadf8a045f" }
stremio-addon-sdk = { path = "../sdk/", features = ["shuttle"] }

# The following crates are needed
semver = "1"
async-trait = "^0.1.88"
tokio = { version = "^1", features = ["full"] }

# Serverless: Shuttle
shuttle-runtime = { version = "^0.53.0", optional = true }

# NOT Working:
# for now.sh/vercel or heroku deployments, comment 'stremio-addon-sdk' above and uncomment the following:
# stremio-addon-sdk = {git = "https://github.com/sleeyax/stremio-addon-sdk/"}

# [lib]
# name = "serverless"
# path = "src/serverless.rs"
